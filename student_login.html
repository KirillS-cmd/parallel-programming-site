<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход ученика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
    </div>
  </nav>
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <h4 class="text-center">Вход для ученика</h4>
        <p class="text-muted">Введите логин и пароль, полученные от педагога.</p>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" id="login" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-info">Войти</button>
          </div>
        </form>
        <div id="errorDiv" class="alert alert-danger mt-3 d-none"></div>
        <div class="mt-3 text-center">
          <a href="index.html">На главную</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { loginStudent } from './static/js/auth.js';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;
      const result = await loginStudent(login, password);
      if (result.success) {
        window.location.href = 'student_dashboard.html';
      } else {
        document.getElementById('errorDiv').textContent = result.error;
        document.getElementById('errorDiv').classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
