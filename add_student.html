{% raw %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить ученика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
    </div>
  </nav>
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <h4>Добавить ученика в класс</h4>
        <form id="addForm">
          <div class="mb-3">
            <label class="form-label">ФИО ученика</label>
            <input type="text" id="studentName" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-success">Добавить</button>
          </div>
        </form>
        <div id="resultInfo" class="mt-3"></div>
        <a href="#" id="backLink" class="btn btn-link mt-2">Назад</a>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onAuthStateChangedListener } from './static/js/auth.js';
    import { addStudent } from './static/js/db.js';
    import { auth } from './static/js/firebase-config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const classId = urlParams.get('classId');
    if (!classId) {
      document.getElementById('resultInfo').innerHTML = '<div class="alert alert-danger">Ошибка: не указан класс</div>';
      document.getElementById('addForm').style.display = 'none';
    }
    document.getElementById('backLink').href = `class_detail.html?id=${classId}`;

    onAuthStateChangedListener(async (userData) => {
      if (!userData || userData.role !== 'teacher') {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      if (!name) return;
      const result = await addStudent(auth.currentUser.uid, classId, name);
      const info = document.getElementById('resultInfo');
      if (result.success) {
        info.innerHTML = `<div class="alert alert-success">Ученик добавлен. Логин: <code>${result.login}</code>, пароль: <code>${result.password}</code></div>`;
        document.getElementById('studentName').value = '';
      } else {
        info.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
      }
    });
  </script>
</body>
</html>
{% endraw %}
