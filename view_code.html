<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Код ученика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h3><i class="fas fa-code"></i> Код ученика: <span id="studentName"></span></h3>
        <div class="card shadow-sm">
          <div class="card-body">
            <pre><code id="codeContent"></code></pre>
            <div class="mt-3">
              <button id="markDoneBtn" class="btn btn-success"><i class="fas fa-check"></i> Отметить как выполненное</button>
              <a href="#" class="btn btn-secondary" onclick="window.history.back();">Назад</a>
            </div>
            <div id="statusMsg"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onAuthStateChangedListener, logout } from './static/js/auth.js';
    import { getStudentCode, markCodeChecked, getUser } from './static/js/db.js';
    import { doc, getDoc } from 'firebase/firestore';
    import { db } from './static/js/firebase-config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('studentId');
    if (!studentId) {
      alert('Не указан ученик');
      window.history.back();
    }

    onAuthStateChangedListener(async (userData) => {
      if (!userData || userData.role !== 'teacher') {
        window.location.href = 'index.html';
        return;
      }
      const nav = document.getElementById('navLinks');
      nav.innerHTML = `<li class="nav-item"><a class="nav-link" href="teacher_dashboard.html"><i class="fas fa-chalkboard"></i> Кабинет</a></li>
                       <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>`;
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
        window.location.href = 'index.html';
      });

      const codeData = await getStudentCode(studentId);
      if (!codeData) {
        document.getElementById('codeContent').textContent = 'Код не найден';
        document.getElementById('markDoneBtn').style.display = 'none';
        return;
      }
      const user = await getUser(studentId);
      document.getElementById('studentName').textContent = user ? user.name : 'Неизвестно';
      document.getElementById('codeContent').textContent = codeData.answer || 'Код пуст';

      if (codeData.completed && codeData.checkedByTeacher) {
        document.getElementById('markDoneBtn').disabled = true;
        document.getElementById('markDoneBtn').textContent = '✅ Проверено';
        document.getElementById('statusMsg').innerHTML = '<span class="badge bg-success">Задание принято</span>';
      } else {
        document.getElementById('markDoneBtn').addEventListener('click', async () => {
          await markCodeChecked(studentId);
          document.getElementById('markDoneBtn').disabled = true;
          document.getElementById('markDoneBtn').textContent = '✅ Проверено';
          document.getElementById('statusMsg').innerHTML = '<span class="badge bg-success">Задание отмечено как выполненное</span>';
        });
      }
    });
  </script>
</body>
</html>
