<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Класс</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    <div id="classHeader" class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fas fa-users text-primary"></i> Класс: <span id="className"></span></h2>
      <span class="badge bg-primary rounded-pill fs-6" id="studentCount">0 учеников</span>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <a href="#" id="addStudentLink" class="btn btn-success"><i class="fas fa-user-plus"></i> Добавить ученика</a>
      <a href="#" id="importLink" class="btn btn-info text-white"><i class="fas fa-file-import"></i> Импорт из Excel/CSV</a>
      <button id="exportBtn" class="btn btn-secondary"><i class="fas fa-file-excel"></i> Скачать результаты (Excel)</button>
      <a href="teacher_dashboard.html" class="btn btn-outline-primary"><i class="fas fa-arrow-left"></i> Назад</a>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle shadow-sm">
        <thead class="table-primary">
          <tr>
            <th>ФИО</th>
            <th>Логин</th>
            <th>Пароль</th>
            <th>Практика (%)</th>
            <th>Код задания 5</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module">
    import { onAuthStateChangedListener, logout } from './static/js/auth.js';
    import { getClass, getStudentsWithProgress, removeStudentFromClass } from './static/js/db.js';
    import { db } from './static/js/firebase-config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const classId = urlParams.get('id');
    if (!classId) {
      alert('Не указан класс');
      window.location.href = 'teacher_dashboard.html';
    }

    onAuthStateChangedListener(async (userData) => {
      if (!userData || userData.role !== 'teacher') {
        window.location.href = 'index.html';
        return;
      }
      // Навигация
      const nav = document.getElementById('navLinks');
      nav.innerHTML = `<li class="nav-item"><a class="nav-link" href="teacher_dashboard.html"><i class="fas fa-chalkboard"></i> Кабинет</a></li>
                       <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>`;
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault(); await logout(); window.location.href = 'index.html';
      });

      const cls = await getClass(classId);
      if (!cls || cls.teacherId !== userData.user.uid) {
        alert('Нет доступа к этому классу');
        window.location.href = 'teacher_dashboard.html';
        return;
      }
      document.getElementById('className').textContent = cls.name;
      document.getElementById('addStudentLink').href = `add_student.html?classId=${classId}`;
      document.getElementById('importLink').href = `import_students.html?classId=${classId}`;

      const students = await getStudentsWithProgress(classId);
      document.getElementById('studentCount').textContent = students.length + ' учеников';
      const tbody = document.getElementById('studentsBody');
      if (students.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">В классе пока нет учеников.</td></tr>';
      } else {
        tbody.innerHTML = students.map(s => `
          <tr>
            <td><i class="fas fa-user-circle text-secondary"></i> ${s.name}</td>
            <td><code>${s.login}</code></td>
            <td><code>${s.password}</code></td>
            <td>
              <div class="progress" style="height:20px; width:120px;">
                <div class="progress-bar bg-success" role="progressbar" style="width: ${s.practicePercent}%;" aria-valuenow="${s.practicePercent}" aria-valuemin="0" aria-valuemax="100">${s.practicePercent}%</div>
              </div>
            </td>
            <td>
              ${s.codeExists ? `<a href="view_code.html?studentId=${s.id}" class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i> Смотреть код</a>` : '<span class="text-muted">Нет кода</span>'}
            </td>
            <td>
              <button class="btn btn-danger btn-sm remove-student" data-student-class-id="${s.studentClassId}" data-name="${s.name}"><i class="fas fa-trash-alt"></i></button>
            </td>
          </tr>
        `).join('');

        // Удаление ученика
        document.querySelectorAll('.remove-student').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm(`Удалить ученика ${btn.dataset.name}?`)) {
              await removeStudentFromClass(btn.dataset.studentClassId);
              location.reload();
            }
          });
        });
      }

      // Экспорт в Excel (ФИО, Логин, Пароль, Практика %, Код задания 5)
      document.getElementById('exportBtn').addEventListener('click', () => {
        const data = students.map(s => ({
          'ФИО': s.name,
          'Логин': s.login,
          'Пароль': s.password,
          'Практика (%)': s.practicePercent,
          'Код задания 5': s.codeExists ? 'есть' : 'нет'
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Результаты');
        XLSX.writeFile(wb, `class_${cls.name}_results.xlsx`);
      });
    });
  </script>
</body>
</html>
