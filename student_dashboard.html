<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет ученика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    <h2><i class="fas fa-user-graduate text-info"></i> Мой кабинет</h2>
    <div class="row mt-4">
      <div class="col-md-6">
        <div class="card shadow-lg border-0 h-100">
          <div class="card-body text-center">
            <i class="fas fa-book-open fa-4x text-primary mb-3"></i>
            <h5 class="card-title">Теория</h5>
            <a href="theory.html" class="btn btn-primary btn-lg w-100"><i class="fas fa-arrow-right"></i> Перейти к теории</a>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-lg border-0 h-100">
          <div class="card-body text-center">
            <i class="fas fa-tasks fa-4x text-success mb-3"></i>
            <h5 class="card-title">Практика</h5>
            <a href="practice.html" class="btn btn-success btn-lg w-100"><i class="fas fa-arrow-right"></i> Перейти к практике</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onAuthStateChangedListener, logout } from './static/js/auth.js';
    onAuthStateChangedListener((userData) => {
      if (!userData || userData.role !== 'student') {
        window.location.href = 'index.html';
      }
      const nav = document.getElementById('navLinks');
      nav.innerHTML = `<li class="nav-item"><a class="nav-link" href="student_dashboard.html"><i class="fas fa-user-graduate"></i> Кабинет</a></li>
                       <li class="nav-item"><a class="nav-link" href="theory.html"><i class="fas fa-book-open"></i> Теория</a></li>
                       <li class="nav-item"><a class="nav-link" href="practice.html"><i class="fas fa-tasks"></i> Практика</a></li>
                       <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>`;
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
