<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация педагога</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3 class="text-center">Регистрация педагога</h3>
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">ФИО</label>
            <input type="text" id="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Электронная почта</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Город</label>
            <input type="text" id="city" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Школа</label>
            <input type="text" id="school" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Номер телефона</label>
            <input type="text" id="phone" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" id="password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">Подтвердите пароль</label>
            <input type="password" id="confirm" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
          </div>
        </form>
        <div class="mt-3 text-center">
          <a href="teacher_login.html">Уже есть аккаунт? Войдите</a><br>
          <a href="index.html">На главную</a>
        </div>
        <div id="registerError" class="alert alert-danger mt-3 d-none"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { registerTeacher } from './static/js/auth.js';
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const city = document.getElementById('city').value;
      const school = document.getElementById('school').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        document.getElementById('registerError').textContent = 'Пароли не совпадают';
        document.getElementById('registerError').classList.remove('d-none');
        return;
      }
      const result = await registerTeacher(email, password, name, city, school, phone);
      if (result.success) {
        alert('Регистрация успешна! Теперь войдите.');
        window.location.href = 'teacher_login.html';
      } else {
        document.getElementById('registerError').textContent = result.error;
        document.getElementById('registerError').classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
