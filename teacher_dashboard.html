<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет педагога</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h2><i class="fas fa-chalkboard-teacher text-primary"></i> Кабинет педагога</h2>
    <div class="row mt-4">
      <div class="col-md-4">
        <div class="card shadow-lg border-0 h-100">
          <div class="card-body text-center">
            <i class="fas fa-plus-circle fa-3x text-success mb-3"></i>
            <h5 class="card-title">Создать новый класс</h5>
            <a href="class_create.html" class="btn btn-success w-100"><i class="fas fa-plus"></i> Создать класс</a>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <h5><i class="fas fa-list"></i> Мои классы</h5>
        <div id="classList" class="list-group"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onAuthStateChangedListener, logout } from './static/js/auth.js';
    import { getClasses } from './static/js/db.js';

    onAuthStateChangedListener(async (userData) => {
      if (!userData || userData.role !== 'teacher') {
        window.location.href = 'index.html';
        return;
      }
      // Навигация
      const nav = document.getElementById('navLinks');
      nav.innerHTML = `<li class="nav-item"><a class="nav-link" href="teacher_dashboard.html"><i class="fas fa-chalkboard"></i> Кабинет</a></li>
                       <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>`;
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
        window.location.href = 'index.html';
      });

      // Загружаем классы
      const teacherId = userData.user.uid;
      const classes = await getClasses(teacherId);
      const list = document.getElementById('classList');
      if (classes.length === 0) {
        list.innerHTML = '<div class="alert alert-info">У вас пока нет классов. Создайте первый!</div>';
      } else {
        list.innerHTML = classes.map(cls => `
          <a href="class_detail.html?id=${cls.id}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="fas fa-users text-primary"></i> ${cls.name}</span>
            <span class="badge bg-primary rounded-pill">0 учеников</span>
          </a>
        `).join('');
        // (количество учеников можно обновить отдельно, но для простоты оставим 0)
      }
    });
  </script>
</body>
</html>
