<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Импорт учеников</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
    </div>
  </nav>
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h4>Импорт учеников из файла</h4>
        <p class="text-muted">Загрузите файл Excel (.xlsx, .xls) или CSV с колонкой "ФИО".</p>
        <form id="importForm">
          <div class="mb-3">
            <input type="file" id="fileInput" class="form-control" accept=".xlsx,.xls,.csv" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-info">Импортировать</button>
          </div>
        </form>
        <div id="importResult" class="mt-3"></div>
        <a href="#" id="backLink" class="btn btn-link mt-2">Назад</a>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module">
    import { onAuthStateChangedListener } from './static/js/auth.js';
    import { addStudent } from './static/js/db.js';
    import { auth } from './static/js/firebase-config.js';
    const urlParams = new URLSearchParams(window.location.search);
    const classId = urlParams.get('classId');
    if (!classId) {
      alert('Ошибка');
      window.location.href = 'teacher_dashboard.html';
    }
    document.getElementById('backLink').href = `class_detail.html?id=${classId}`;

    document.getElementById('importForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet);
          const names = json.map(row => row['ФИО'] || row['Имя'] || row['Name'] || row['name']).filter(Boolean);
          let added = 0;
          const results = [];
          for (const name of names) {
            const res = await addStudent(auth.currentUser.uid, classId, name.trim());
            if (res.success) added++;
            results.push(`${name}: ${res.success ? 'успешно' : res.error}`);
          }
          document.getElementById('importResult').innerHTML = `<div class="alert alert-success">Импортировано ${added} из ${names.length} учеников.</div><pre>${results.join('\n')}</pre>`;
        } catch (err) {
          document.getElementById('importResult').innerHTML = `<div class="alert alert-danger">Ошибка: ${err.message}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
