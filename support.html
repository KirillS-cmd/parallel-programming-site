<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Техподдержка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home"></i> Главная</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3><i class="fas fa-headset"></i> Техподдержка</h3>
        <p class="text-muted">Опишите вашу проблему или пожелание.</p>
        <form id="supportForm">
          <div class="mb-3">
            <label class="form-label">Ваше имя</label>
            <input type="text" id="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Ваш email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Сообщение</label>
            <textarea id="message" class="form-control" rows="5" required></textarea>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Отправить</button>
          </div>
        </form>
        <div id="supportResult"></div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { db } from './static/js/firebase-config.js';
    import { collection, addDoc } from 'firebase/firestore';
    document.getElementById('supportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;
      try {
        await addDoc(collection(db, 'supportMessages'), { name, email, message, date: new Date().toISOString() });
        document.getElementById('supportResult').innerHTML = '<div class="alert alert-success">Сообщение отправлено.</div>';
        document.getElementById('supportForm').reset();
      } catch (err) {
        document.getElementById('supportResult').innerHTML = `<div class="alert alert-danger">Ошибка: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
