<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создание класса</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-code"></i> Параллельное программирование</a>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <h4>Создать класс</h4>
        <form id="createClassForm">
          <div class="mb-3">
            <label class="form-label">Название класса</label>
            <input type="text" id="className" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Создать</button>
          </div>
        </form>
        <a href="teacher_dashboard.html" class="btn btn-link mt-2">Назад</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth } from './static/js/firebase-config.js';
    import { createClass } from './static/js/db.js';
    import { onAuthStateChangedListener } from './static/js/auth.js';

    onAuthStateChangedListener(async (userData) => {
      if (!userData || userData.role !== 'teacher') {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('createClassForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('className').value;
      const uid = auth.currentUser.uid;
      const classId = await createClass(uid, name);
      alert('Класс создан!');
      window.location.href = `class_detail.html?id=${classId}`;
    });
  </script>
</body>
</html>
